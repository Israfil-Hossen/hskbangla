<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK-১ · দিন ২</title><style>body{margin:0;font-family:'Nirmala UI','Hind Siliguri',sans-serif;background:#faf7f1;color:#2b2b2b}
header{background:#7B1E2B;color:#fff;padding:16px}header h1{margin:0;font-size:19px}header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:560px;margin:0 auto;padding:10px 16px 50px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e6dccb;border-radius:10px;padding:8px 10px;margin:6px 0}
.row div{flex:1}.zh{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;font-size:21px}
.py{display:block;color:#8A7A66;font-style:italic;font-size:14px}.bn{display:block;font-size:14px;color:#555}
button{background:#7B1E2B;color:#fff;border:0;border-radius:18px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.speed{display:flex;gap:6px;margin:10px 0}.speed button{flex:1;background:#fff;color:#7B1E2B;border:1px solid #7B1E2B}.speed button.on{background:#7B1E2B;color:#fff}
.all{width:100%;margin:6px 0 4px;padding:11px}h2{color:#7B1E2B;font-size:17px;border-bottom:2px solid #d8c29a;padding-bottom:3px}
a{color:#7B1E2B}footer{text-align:center;color:#999;font-size:13px;padding:18px}</style></head><body>
<header><h1>HSK-১ · দিন ২</h1><p>শেষ ধ্বনি ও চারটি টোন (声调)</p></header><main>
<div class="speed"><button data-r=".7">ধীরে</button><button data-r=".85" class="on">মাঝারি</button><button data-r="1">স্বাভাবিক</button></div>
<button class="all" id="all">▶ সব একটানা শুনুন</button><h2>আজকের শব্দ</h2><div class='row'><div><span class='zh'>妈</span><span class='py'>mā</span><span class='bn'>মা</span></div><button data-s='a/w01.mp3'>শব্দ ▶</button></div><div class='row' style='margin-left:18px'><div><span class='zh' style='font-size:17px'>我妈妈</span><span class='py'>wǒ māma</span><span class='bn'>আমার মা</span></div><button data-s='a/e01.mp3'>বাক্য ▶</button></div><div class='row'><div><span class='zh'>麻</span><span class='py'>má</span><span class='bn'>পাট</span></div><button data-s='a/w02.mp3'>শব্দ ▶</button></div><div class='row' style='margin-left:18px'><div><span class='zh' style='font-size:17px'>麻</span><span class='py'>má</span><span class='bn'>২য় টোন</span></div><button data-s='a/e02.mp3'>বাক্য ▶</button></div><div class='row'><div><span class='zh'>马</span><span class='py'>mǎ</span><span class='bn'>ঘোড়া</span></div><button data-s='a/w03.mp3'>শব্দ ▶</button></div><div class='row' style='margin-left:18px'><div><span class='zh' style='font-size:17px'>马</span><span class='py'>mǎ</span><span class='bn'>নিচে নেমে উপরে</span></div><button data-s='a/e03.mp3'>বাক্য ▶</button></div><div class='row'><div><span class='zh'>骂</span><span class='py'>mà</span><span class='bn'>বকা দেওয়া</span></div><button data-s='a/w04.mp3'>শব্দ ▶</button></div><div class='row' style='margin-left:18px'><div><span class='zh' style='font-size:17px'>骂</span><span class='py'>mà</span><span class='bn'>উপর থেকে নিচে</span></div><button data-s='a/e04.mp3'>বাক্য ▶</button></div><div class='row'><div><span class='zh'>吗</span><span class='py'>ma</span><span class='bn'>প্রশ্নের চিহ্ন</span></div><button data-s='a/w05.mp3'>শব্দ ▶</button></div><div class='row' style='margin-left:18px'><div><span class='zh' style='font-size:17px'>你好吗?</span><span class='py'>Nǐ hǎo ma?</span><span class='bn'>তুমি ভালো আছ?</span></div><button data-s='a/e05.mp3'>বাক্য ▶</button></div></main>
<footer>গল্পে গল্পে HSK · facebook.com/hskbangla</footer><script>const a=new Audio();let r=.85,q=[];
function play(s){a.src=s;a.playbackRate=r;a.play();}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{q=[];play(b.dataset.s)});
const all=document.getElementById('all');if(all)all.onclick=()=>{q=[...document.querySelectorAll('[data-s]')].map(b=>b.dataset.s);next();};
function next(){const s=q.shift();if(s)play(s);}a.onended=()=>setTimeout(next,600);
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{r=+b.dataset.r;a.playbackRate=r;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));});</script></body></html>
