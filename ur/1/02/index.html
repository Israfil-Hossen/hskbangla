<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet"><style>body{margin:0;font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting',serif;background:#faf7f1;color:#2b2b2b}
header{background:#7B1E2B;color:#fff;padding:14px 16px}header h1{margin:0;font-size:20px;line-height:2}header p{margin:0;opacity:.85;font-size:14px;line-height:2}
main{max-width:560px;margin:0 auto;padding:10px 16px 50px}

.speed{display:flex;gap:6px;margin:10px 0}.speed button{flex:1;background:#fff;color:#7B1E2B;border:1px solid #7B1E2B}.speed button.on{background:#7B1E2B;color:#fff}
.all{width:100%;margin:6px 0 4px;padding:10px}h2{color:#7B1E2B;font-size:17px;border-bottom:2px solid #d8c29a}

<button class="all" id="all">▶ سب ایک ساتھ سنیں</button><h2>آج کے الفاظ</h2><div class='row'><div><span class='zh'>妈</span><span class='py'>mā</span><span class='ur'>ماں</span></div><button data-s='../../../1/02/a/w01.mp3'>لفظ ▶</button></div><div class='row' style='margin-right:18px'><div><span class='zh' style='font-size:17px'>我妈妈</span><span class='py'>wǒ māma</span><span class='ur'>میری ماں</span></div><button data-s='../../../1/02/a/e01.mp3'>جملہ ▶</button></div><div class='row'><div><span class='zh'>麻</span><span class='py'>má</span><span class='ur'>سَن (پٹ سن)</span></div><button data-s='../../../1/02/a/w02.mp3'>لفظ ▶</button></div><div class='row' style='margin-right:18px'><div><span class='zh' style='font-size:17px'>麻</span><span class='py'>má</span><span class='ur'>دوسری ٹون</span></div><button data-s='../../../1/02/a/e02.mp3'>جملہ ▶</button></div><div class='row'><div><span class='zh'>马</span><span class='py'>mǎ</span><span class='ur'>گھوڑا</span></div><button data-s='../../../1/02/a/w03.mp3'>لفظ ▶</button></div><div class='row' style='margin-right:18px'><div><span class='zh' style='font-size:17px'>马</span><span class='py'>mǎ</span><span class='ur'>نیچے جا کر اوپر</span></div><button data-s='../../../1/02/a/e03.mp3'>جملہ ▶</button></div><div class='row'><div><span class='zh'>骂</span><span class='py'>mà</span><span class='ur'>ڈانٹنا</span></div><button data-s='../../../1/02/a/w04.mp3'>لفظ ▶</button></div><div class='row' style='margin-right:18px'><div><span class='zh' style='font-size:17px'>骂</span><span class='py'>mà</span><span class='ur'>اوپر سے نیچے</span></div><button data-s='../../../1/02/a/e04.mp3'>جملہ ▶</button></div><div class='row'><div><span class='zh'>吗</span><span class='py'>ma</span><span class='ur'>سوالیہ لفظ (ہاں/نہیں)</span></div><button data-s='../../../1/02/a/w05.mp3'>لفظ ▶</button></div><div class='row' style='margin-right:18px'><div><span class='zh' style='font-size:17px'>你好吗?</span><span class='py'>Nǐ hǎo ma?</span><span class='ur'>ک <footer>کہانیوں کہانیوں میں چینی زبان · facebook.com/hskbangla</footer><script>const a=new Audio();let r=.85,q=[];
function play(s){a.src=s;a.playbackRate=r;a.play();}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{q=[];play(b.dataset.s)});
const all=document.getElementById('all');if(all)all.onclick=()=>{q=[...document.querySelectorAll('[data-s]')].map(b=>b.dataset.s);next();};
function next(){const s=q.shift();if(s)play(s);}a.onended=()=>setTimeout(next,600);
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{r=+b.dataset.r;a.playbackRate=r;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));});</script></body></html>
